{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 shadow-sm p-4 rounded bg-white border">
        <h2 class="fw-bold mb-4">Новый товар</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-2 mt-3">Сохранить в БД</button>
        </form>
    </div>
</div>
{% endblock %}
