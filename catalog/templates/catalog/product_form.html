{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 shadow-sm p-4 rounded bg-white border">
        <h2 class="fw-bold mb-4">{% if object %}Редактирование товара{% else %}Новый товар{% endif %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert alert-danger" style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                    <strong>Пожалуйста, исправьте следующие ошибки:</strong>
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-2 mt-3">Сохранить изменения</button>
        </form>
    </div>
</div>
{% endblock %}
