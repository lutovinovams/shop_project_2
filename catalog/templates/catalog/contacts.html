{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 shadow-sm p-4 rounded bg-white border">
        <h1 class="fw-bold mb-4">Наши контакты</h1>

        <div class="row g-4">
            <div class="col-md-6">
                <h5 class="fw-bold text-secondary">Адрес офиса</h5>
                <p class="text-muted">г. Москва, ул. Программистов, д. 42</p>

                <h5 class="fw-bold text-secondary mt-4">Телефон</h5>
                <p class="text-muted">+7 (999) 123-45-67</p>

                <h5 class="fw-bold text-secondary mt-4">Электронная почта</h5>
                <p class="text-muted">support@skystore.ru</p>
            </div>

            <div class="col-md-6 border-start ps-4">
                <h4 class="fw-bold mb-3">Связаться с нами</h4>
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Ваше имя</label>
                        <input type="text" name="name" id="name" class="form-line form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Номер телефона</label>
                        <input type="tel" name="phone" id="phone" class="form-line form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea name="message" id="message" rows="4" class="form-line form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Отправить сообщение</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
