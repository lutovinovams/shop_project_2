<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Skystore</title>
    <style>
        /* Встроенная замена Bootstrap для автономной работы */
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background-color: #f8f9fa; display: flex; flex-column: column; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        .my-5 { margin-top: 3rem; margin-bottom: 3rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .navbar { background-color: #212529; padding: 1rem 0; color: white; box-shadow: 0 .5rem 1rem rgba(0,0,0,.05); }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { font-weight: bold; color: white; text-decoration: none; font-size: 1.25rem; }
        .navbar-nav { display: flex; gap: 1rem; }
        .nav-link { color: rgba(255,255,255,.55); text-decoration: none; }
        .nav-link:hover { color: rgba(255,255,255,.75); }
        .row { display: flex; flex-wrap: wrap; margin: -15px; }
        .col { flex: 1 0 25%; min-width: 280px; padding: 15px; box-sizing: border-box; }
        .col-md-6 { flex: 0 0 50%; padding: 15px; box-sizing: border-box; }
        .card { background: white; border-radius: 8px; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .card-body { padding: 1.25rem; flex: 1 1 auto; }
        .card-title { font-size: 1.25rem; margin: 0 0 0.75rem 0; font-weight: bold; }
        .card-text { color: #6c757d; font-size: 1rem; margin-bottom: 1rem; }
        .card-footer { padding: 0.75rem 1.25rem; background: transparent; border-top: none; }
        .text-success { color: #198754 !important; font-weight: bold; }
        .btn { display: inline-block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; text-align: center; text-decoration: none; border-radius: 4px; border: 1px solid transparent; box-sizing: border-box; cursor: pointer; }
        .btn-primary { background-color: #0d6efd; color: white; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-success { background-color: #198754; color: white; width: auto; }
        .btn-outline-secondary { border-color: #6c757d; color: #6c757d; background: transparent; width: auto; }
        .btn-outline-secondary:hover { background: #6c757d; color: white; }
        footer { background: #f8f9fa; text-align: center; padding: 1.5rem 0; margin-top: auto; border-top: 1px solid #dee2e6; color: #6c757d; }
        .d-flex { display: flex; }
        .justify-content-between { justify-content: space-between; }
        .align-items-center { align-items: center; }
        .fw-bold { font-weight: bold; }
        .badge { display: inline-block; padding: 0.35em 0.65em; font-size: .75em; font-weight: 700; line-height: 1; color: #fff; text-align: center; white-space: nowrap; vertical-align: baseline; border-radius: 0.375rem; background-color: #6c757d; }
        .shadow { box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
        .img-fluid { max-width: 100%; height: auto; }
        .rounded { border-radius: 0.375rem!important; }
        .lead { font-size: 1.25rem; font-weight: 300; }
        hr { margin: 1rem 0; color: inherit; border: 0; border-top: 1px solid #dee2e6; opacity: .25; }
        .form-control { display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; line-height: 1.5; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; box-sizing: border-box; }
        .form-label { margin-bottom: 0.5rem; display: inline-block; font-weight: bold; }
        .mb-3 { margin-bottom: 1rem; }
    </style>
</head>
<body>

    {% include 'catalog/includes/inc_nav.html' %}

    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Skystore. Все права защищены.</p>
    </footer>

</body>
</html>
