{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 bg-white p-4 rounded shadow-sm border">
        <h1 class="display-5 fw-bold mb-3">{{ article.title }}</h1>
        <div class="text-muted small mb-4">
            <span>Опубликовано: {{ article.created_at|date:"d.m.Y H:i" }}</span> | 
            <span class="text-success fw-bold">Просмотров: {{ article.views_count }}</span>
        </div>
        <hr>
        {% if article.preview %}
            <img src="{{ article.preview.url }}" class="img-fluid rounded mb-4" alt="{{ article.title }}">
        {% endif %}
        <p class="fs-5 text-secondary" style="white-space: pre-line;">{{ article.content }}</p>
        <hr class="my-4">
        <div class="d-flex justify-content-between">
            <a href="{% url 'blog:article_list' %}" class="btn btn-outline-secondary">Назад к статьям</a>
            <div>
                <a href="{% url 'blog:article_edit' article.pk %}" class="btn btn-warning text-white me-2">Редактировать</a>
                <a href="{% url 'blog:article_delete' article.pk %}" class="btn btn-danger">Удалить</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
