{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 shadow-sm p-4 rounded bg-white border text-center">
        <h2 class="fw-bold mb-4 text-danger">Удаление статьи</h2>
        <p class="fs-5">Вы уверены, что хотите безвозвратно удалить статью <strong>"{{ object.title }}"</strong>?</p>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4 py-2 me-2">Да, удалить</button>
            <a href="{% url 'blog:article_detail' object.pk %}" class="btn btn-outline-secondary px-4 py-2">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
