{% extends 'catalog/base.html' %}

{% block content %}
{# Шаблон страницы регистрации нового пользователя #}
<div class="row justify-content-center">
    <div class="col-md-6 shadow-sm p-4 rounded bg-white border">
        <h2 class="fw-bold mb-4">Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-2 mt-3">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'users:login' %}" class="text-decoration-none small">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>
{% endblock %}
