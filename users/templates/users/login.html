{% extends 'catalog/base.html' %}

{% block content %}
{# Шаблон страницы авторизации пользователя по email и паролю #}
<div class="row justify-content-center">
    <div class="col-md-6 shadow-sm p-4 rounded bg-white border">
        <h2 class="fw-bold mb-4">Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Войти</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'users:register' %}" class="text-decoration-none small">Еще не зарегистрированы? Создать аккаунт</a>
        </div>
    </div>
</div>
{% endblock %}
